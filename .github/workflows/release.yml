---
name: "Release"
on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to LuaRocks
        required: true
        type: string
      revision:
        description: LuaRocks rockspec revision
        default: '1'
        type: string

permissions: {}

jobs:
  luarocks-release:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    name: Luarocks Release
    env:
      LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
    steps:
      - name: Validate release inputs
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          ROCKSPEC_REVISION: ${{ inputs.revision || '1' }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ROCKSPEC_REVISION" =~ ^[1-9][0-9]*$ ]]
        shell: bash
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Luarocks Upload
        uses: nvim-neorocks/luarocks-tag-release@v8
        if: github.event_name == 'workflow_dispatch' || env.LUAROCKS_API_KEY != ''
        with:
          version: ${{ inputs.tag || github.ref_name }}
          specrev: ${{ inputs.revision || '1' }}
          dependencies: |
            lua >= 5.1
            nvim-nio
        env:
          GITHUB_REF_TYPE_OVERRIDE: tag
          GITHUB_REF_NAME_OVERRIDE: ${{ inputs.tag || github.ref_name }}
  gh-release:
    if: github.event_name == 'push'
    permissions:
      contents: write
    needs: luarocks-release
    runs-on: ubuntu-latest
    name: GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
